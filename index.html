<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("orange-background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 500px;
            width: 100%;

            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #35156b;
            font-size: 25px;
            margin-bottom: 30px;
        }

        label {
            color: #35156b;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            height: 42px;
            border-radius: 8px;
        }

        .check {
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .chec-labl {
            margin-left: 5px;
        }

        .date {
            display: flex;
            gap: 15px;
        }

        .lab1 {
            width: 50%;
        }

        .Time {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .c1 {
            width: 25%;
        }

        .form-select {
            height: 42px;
            border-radius: 8px;
        }

        .age {
            margin-bottom: 15px;
        }

        .age input {
            accent-color: #35156b;
        }

        .features {
            margin-bottom: 20px;
        }

        .features p {
            color: #35156b;
            margin-bottom: 8px;
        }

        /* تنسيق أيقونة الصح باستخدام CSS */
        .check-icon {
            color: green;
            font-weight: bold;
            margin-right: 8px;
        }

        .search-btn {
            width: 100%;
            height: 48px;

            background-color: red;
            color: white;

            border: none;
            border-radius: 25px;

            font-weight: bold;
            font-size: 16px;
        }

        .search-btn:hover {
            background-color: #d90000;
        }

    </style>
</head>

<body>

    <div class="card">

        <h2>Search for a rental car</h2>

        <form>
            <div class="form1">

                <label for="location">
                    Pick up location
                </label>

                <input
                    type="text"
                    id="location"
                    class="form-control"
                    placeholder="City, airport, region, district..."
                >

            </div>

            <div class="check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="deliver"
                >

                <label for="deliver" class="chec-labl">
                    Deliver the car somewhere else
                </label>

            </div>

            <div class="date">

                <div class="lab1">

                    <label>
                        Date of pickup
                    </label>

                    <input type="date" class="form-control">

                </div>

                <div class="lab1">

                    <label>
                        Date of delivery
                    </label>

                    <input type="date" class="form-control">

                </div>

            </div>

            <div class="Time">

                <div class="c1">
                    <select class="form-select">
                        <option>00</option>
                        <option>01</option>
                        <option>02</option>
                        <option>03</option>
                        <option>04</option>
                        <option>05</option>
                        <option>06</option>
                        <option>07</option>
                        <option>08</option>
                        <option>09</option>
                        <option selected>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                    </select>
                </div>

                <div class="c1">
                    <select class="form-select">
                        <option selected>00</option>
                        <option>01</option>
                        <option>02</option>
                        <option>03</option>
                        <option>04</option>
                        <option>05</option>
                        <option>06</option>
                        <option>07</option>
                        <option>08</option>
                        <option>09</option>
                        <option>10</option>
                    </select>
                </div>

                <div class="c1">
                    <select class="form-select">
                        <option>01</option>
                        <option>02</option>
                        <option>03</option>
                        <option>04</option>
                        <option>05</option>
                        <option>06</option>
                        <option>07</option>
                        <option>08</option>
                        <option>09</option>
                        <option selected>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                    </select>                  
                </div>

                <div class="c1">
                    <select class="form-select">
                        <option selected>00</option>
                        <option>01</option>
                        <option>02</option>
                        <option>03</option>
                        <option>04</option>
                        <option>05</option>
                        <option>06</option>
                        <option>07</option>
                        <option>08</option>
                        <option>09</option>
                        <option>10</option>
                    </select>
                </div>

            </div>

            <div class="age">

                <input
                    type="checkbox" id="age" checked>

                <label for="age">
                    The driver's age between 30 and 65?
                </label>

            </div>

            <div class="features">

                <p>
                    <span class="check-icon">&#10003;</span>
                    No credit card fees
                </p>

                <p>
                    <span class="check-icon">&#10003;</span>
                    No change fees
                </p>

                <p>
                    <span class="check-icon">&#10003;</span>
                    Price match guarantee
                </p>

            </div>

            <button
                type="submit"
                class="search-btn">
                Search
            </button>

        </form>

    </div>

</body>

</html>
